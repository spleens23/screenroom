<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https://*.mzstatic.com; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenroom</title>
<link rel="stylesheet" href="fonts/noto-sans-jp.css">
<link rel="stylesheet" href="fonts/matinee/matinee.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-matinee.css">
<link rel="stylesheet" href="theme-heirloom.css">
<link rel="stylesheet" href="parlor-modern.css">
</head>
<body>
<header id="nav">
  <div class="brand">Screenroom</div>
  <nav>
    <a href="#" data-view="home" class="active">Home</a>
    <a href="#" data-view="tv">TV Shows</a>
    <a href="#" data-view="movies">Movies</a>
    <a href="#" data-view="4k">4K</a>
    <a href="#" data-view="hd">HD</a>
    <a href="#" data-view="sd">SD</a>
  </nav>
  <nav id="pnav">
    <a href="#" data-pview="home" class="active"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#" data-pview="albums"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x="4" y="7" width="13" height="13" rx="2"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 4h10a2 2 0 0 1 2 2v10"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="10.5" cy="13.5" r="2.4"/></svg><span>Albums</span></a>
    <a href="#" data-pview="artists"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="8.5" r="3.6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg><span>Artists</span></a>
    <a href="#" data-pview="songs"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18V6l10-2v12"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="6.5" cy="18" r="2.5"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="16.5" cy="16" r="2.5"/></svg><span>Songs</span></a>
    <a href="#" data-pview="playlists"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h12M4 11h12M4 16h7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M17 18v-6l4-1"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="15.5" cy="18" r="1.6"/></svg><span>Playlists</span></a>
  </nav>
  <div class="nav-right">
    <span id="battery" hidden></span>
    <button id="vote-btn" title="Movie night vote" hidden></button>
    <button id="parlor-btn" title="Parlor (music)" hidden></button>
    <input id="search" type="search" placeholder="Search titles, genres…" autocomplete="off">
    <button id="settings-btn" title="Settings" aria-label="Settings"><svg class="i-gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" d="M10.3 3h3.4l.5 2.4 1.7.9 2.3-.9 1.7 2.9-1.8 1.6v2.2l1.8 1.6-1.7 2.9-2.3-.9-1.7.9-.5 2.4h-3.4l-.5-2.4-1.7-.9-2.3.9-1.7-2.9 1.8-1.6v-2.2L3.9 8.3l1.7-2.9 2.3.9 1.7-.9z"/></svg></button>
  </div>
</header>

<main id="main"></main>

<div id="scan-status" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal-card narrow" role="dialog" aria-modal="true">
    <button class="close" id="settings-close" aria-label="Close">✕</button>
    <div id="settings-body"></div>
  </div>
</div>

<script src="../lib/media-core.js"></script>
<script src="licenses.js"></script>
<script src="avatars.js"></script>
<script src="parlor.js"></script>
<script src="app.js"></script>
</body>
</html>
