# Screenroom automatic installer (Debian 13). Installs Debian + Screenroom with no questions.
# Works with or without a network cable: everything Screenroom needs is on the USB stick.

d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string screenroom
d-i netcfg/get_domain string local
d-i netcfg/hostname string screenroom
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
# No network cable / no internet: carry on without (nothing needs downloading).
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/no_default_route boolean true
d-i apt-mirror-setup/no_mirror boolean true
d-i apt-setup/service-failed note
d-i apt-setup/security-updates-failed note
d-i pkgsel/update-failed note
d-i hw-detect/load_firmware boolean true
d-i netcfg/wireless_wep string
d-i base-installer/kernel/image string linux-image-amd64

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Accounts: no root password; a "screenroom" user for maintenance (its password is replaced with a
# random one shown in Screenroom's Settings). The TV user is created by Screenroom's setup.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Screenroom Maintenance
d-i passwd/username string screenroom
d-i passwd/user-password-crypted password @ADMIN_HASH@
d-i passwd/user-default-groups string audio cdrom video sudo
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

# Disk: pick-disk.sh chooses the drive (never a USB drive, never a drive with your movies).
d-i partman/early_command string sh /cdrom/screenroom/installer/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-cdrom-setup/another boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true

# Nothing extra here: Screenroom's setup installs what it needs (from the stick if there's no internet).
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

d-i preseed/late_command string sh /cdrom/screenroom/installer/late.sh

d-i finish-install/reboot_in_progress note
# Turn off when done (instead of restarting): a restart with the USB stick still in would start the installer again.
d-i debian-installer/exit/poweroff boolean true
d-i cdrom-detect/eject boolean true
