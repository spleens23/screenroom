# Screenroom installer boot menu (UEFI)
if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set timeout=15
set default=0

menuentry "Install Screenroom  (ERASES this computer's main drive)" {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 quiet ---
    initrd   /install.amd/initrd.gz
}
menuentry "Don't install: start the computer normally" {
    exit
}
