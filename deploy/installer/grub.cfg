# Screenroom installer boot menu (UEFI)
if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set timeout=15
set default=0
# Screenroom already installed on this computer? Then start it normally unless "Install" is picked by hand,
# so leaving the USB stick in never reinstalls by itself.
if search --no-floppy --file --set=sr_installed /etc/screenroom/appliance ; then
  set default=1
  set timeout=8
fi

menuentry "Install Screenroom  (ERASES this computer's main drive)" {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg netcfg/enable=false vga=788 quiet ---
    initrd   /install.amd/initrd.gz
}
menuentry "Don't install: start the computer normally (Screenroom, if it is already installed)" {
    # Hand over to the installed system's own boot menu (going back to the firmware isn't reliable: some
    # computers stop in their setup screen instead of trying the next drive).
    if search --no-floppy --file --set=root /etc/screenroom/appliance ; then
        configfile /boot/grub/grub.cfg
    fi
    exit
}
