# Screenroom for iPad. The Xcode project is generated from this file by XcodeGen
# (the build workflow does it: `xcodegen generate` in this folder).
name: Screenroom
options:
  bundleIdPrefix: dev.screenroom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Screenroom:
    type: application
    platform: iOS
    sources:
      - path: Screenroom
      # The same screens as the desktop app (copied in by scripts/prepare-web.sh), as a folder in the app.
      - path: Web
        type: folder
        buildPhase: resources
    dependencies:
      # VLC's engine (scripts/fetch-vlckit.sh puts it in vendor/): DTS / TrueHD sound, MKV and other files
      - framework: vendor/MobileVLCKit.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libbz2.tbd
      - sdk: libz.tbd
      - sdk: libxml2.tbd
      - sdk: AudioToolbox.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenroom.ipad
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        PRODUCT_NAME: Screenroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Screenroom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
