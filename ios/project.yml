# Screenroom and Parlor for iPhone and iPad. The Xcode project is generated from this file by XcodeGen
# (the build workflow does it: `xcodegen generate` in this folder).
name: Screenroom
options:
  bundleIdPrefix: dev.screenroom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO
# Two apps from the same code and screens: Screenroom (films) and Parlor (music). Each one's Info.plist says
# which it is (SRApp), and the screens open in films or in Parlor accordingly.
targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: Screenroom
        excludes: ["Info.plist"]
      # The same screens as the desktop app (copied in by scripts/prepare-web.sh), as a folder in the app.
      - path: Web
        type: folder
        buildPhase: resources
    dependencies:
      # mpv's engine and FFmpeg (MPVKit, LGPL build): DTS / TrueHD sound (also inside MP4), MKV and other files
      # (filled in by scripts/fetch-mpvkit.sh)
      # MPVKIT_FRAMEWORKS
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libbz2.tbd
      - sdk: libz.tbd
      - sdk: libxml2.tbd
      - sdk: AudioToolbox.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: OpenGLES.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: CoreVideo.framework
      - sdk: CoreFoundation.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: libexpat.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
targets:
  Screenroom:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenroom.ipad
        PRODUCT_NAME: Screenroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Screenroom/Info.plist
    scheme:
      testTargets: [ScreenroomUITests]
  Parlor:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenroom.parlor
        PRODUCT_NAME: Parlor
        ASSETCATALOG_COMPILER_APPICON_NAME: ParlorIcon
        INFOPLIST_FILE: Parlor/Info.plist
    scheme:
      testTargets: [ParlorUITests]
  # Parlor with a keyboard in a simulated iPad (the build workflow runs it)
  ParlorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParlorUITests]
    dependencies:
      - target: Parlor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenroom.parlor.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  # Taps through the player in a simulated iPad (the build workflow runs it)
  ScreenroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Screenroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.screenroom.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
