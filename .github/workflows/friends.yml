name: Parlor friends service

# Puts Parlor's friends service (friends/worker.js) on Cloudflare, free plan. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (a token made from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# The first time (or if the service's address changes) it writes the address into renderer/friends-config.js
# and starts the app builds, so the apps know where to find it.

on:
  push:
    branches: [main]
    paths: ['friends/**', '.github/workflows/friends.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: friends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Try the service here first
        run: node friends/test-local.mjs

      - name: Is Cloudflare set up?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Friends::Not put on Cloudflare yet: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository's secrets."; echo "ready=no" >> "$GITHUB_OUTPUT"; fi

      - name: Put it on Cloudflare
        if: steps.cf.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          # (a space or line break pasted with a secret doesn't count)
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "account id: ${#CLOUDFLARE_ACCOUNT_ID} characters$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$' && echo ', looks right' || echo ', not the 32 letters and numbers an Account ID has')"
          # the accounts this token can use: if it's just one, that's the one
          ACCTS=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          echo "accounts the token can use: $(echo "$ACCTS" | jq -c '{success, count: (.result | length), errors: [.errors[]?.message]}')"
          if ! echo "$ACCTS" | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result[]? | select(.id == $id)' > /dev/null; then
            if [ "$(echo "$ACCTS" | jq '.result | length')" = 1 ]; then
              echo "::warning title=Friends::CLOUDFLARE_ACCOUNT_ID isn't the account this token is for; using the token's own account instead."
              CLOUDFLARE_ACCOUNT_ID=$(echo "$ACCTS" | jq -r '.result[0].id')
            fi
          fi
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          # the token works? (Cloudflare's own answer, without the token itself)
          V=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "token check: $(echo "$V" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          if [ "$(echo "$V" | jq -r .success)" != true ]; then
            echo "::error title=Friends::Cloudflare didn't accept CLOUDFLARE_API_TOKEN. It should be an API Token (My Profile → API Tokens → Create Token → 'Edit Cloudflare Workers'), not the Global API Key, pasted with nothing before or after it."
            exit 1
          fi
          # the storage (made the first time)
          L=$(curl -sS "${H[@]}" "$API/storage/kv/namespaces?per_page=100")
          echo "storage check: $(echo "$L" | jq -c '{success, errors: [.errors[]?.message]}')"
          [ "$(echo "$L" | jq -r .success)" = true ] || { echo "::error title=Friends::The token works, but can't use Workers storage in that account. Check CLOUDFLARE_ACCOUNT_ID (the 32-character Account ID from Workers & Pages) and that the token was made from the 'Edit Cloudflare Workers' template."; exit 1; }
          KV=$(echo "$L" | jq -r '.result[]? | select(.title == "parlor-friends") | .id' | head -1)
          if [ -z "$KV" ]; then
            C=$(curl -sS "${H[@]}" -X POST "$API/storage/kv/namespaces" -d '{"title":"parlor-friends"}')
            echo "storage made: $(echo "$C" | jq -c '{success, errors: [.errors[]?.message]}')"
            KV=$(echo "$C" | jq -r '.result.id // empty')
          fi
          [ -n "$KV" ] && [ "$KV" != null ] || { echo "::error::Couldn't make the storage. Does the token have Workers KV Storage: Edit?"; exit 1; }
          sed -i "s/KV_ID/$KV/" friends/wrangler.toml
          # the address: <name>.<your workers.dev subdomain>.workers.dev
          SB=$(curl -sS "${H[@]}" "$API/workers/subdomain")
          echo "address check: $(echo "$SB" | jq -c '{success, subdomain: .result.subdomain, errors: [.errors[]?.message]}')"
          SUB=$(echo "$SB" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error title=Friends::This Cloudflare account has no workers.dev address yet. Open Workers & Pages in the Cloudflare dashboard once (it sets one up), then run this again."
            exit 1
          fi
          cd friends
          npx --yes wrangler@4 deploy
          URL="https://parlor-friends.$SUB.workers.dev"
          echo "URL=$URL" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/v1" && break; sleep 10; done
          echo

      - name: Tell the apps where it is
        if: steps.cf.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          WANT="window.FRIENDS_URL = '$URL';"
          if grep -qF "$WANT" renderer/friends-config.js; then echo "The apps already know: $URL"; exit 0; fi
          printf '%s\n%s\n' "// Where Parlor's friends service is (written by .github/workflows/friends.yml)." "$WANT" > renderer/friends-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer/friends-config.js
          git commit -m "Parlor's friends service is at $URL"
          git push
          # (a push made from here doesn't start other builds by itself)
          for w in ios.yml phone-android.yml windows.yml; do gh workflow run "$w" --ref main || echo "couldn't start $w"; done
