name: Linux box (app + automatic installer)

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VERSION: 0.5.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ---- 1. the Screenroom app as a .deb -------------------------------------------------------
      - name: Build the Linux app (.deb)
        run: |
          npm ci
          npm pkg set version="$VERSION"
          npx electron-builder --linux deb dir --x64 -p never
          ls -la dist/*.deb
          # The plain app folder, for systems that bake it into their image (Heirloom pulls this one).
          tar -C dist -czf dist/screenroom-linux-x64.tar.gz --transform 's,^linux-unpacked,screenroom,' linux-unpacked
          ls -la dist/screenroom-linux-x64.tar.gz

      # Fast check (a few minutes) that the whole setup works on Debian 13, before the slow VM test.
      - name: Set up Screenroom inside a Debian 13 container
        run: |
          set +e
          docker run --rm -v "$PWD:/w" debian:trixie bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq adduser sudo >/dev/null
            # like a fresh install from the USB stick: the stick is still listed as a package source
            echo "deb cdrom:[Debian GNU/Linux 13 _Trixie_ - Official amd64 NETINST]/ trixie main" >> /etc/apt/sources.list
            cd /w/deploy && SCREENROOM_CHROOT=1 bash ./install-tv.sh /w/dist/screenroom_*_amd64.deb
            echo "--- Bluetooth sound service:"; command -v bluealsad bluealsa || true
            cat /usr/lib/systemd/system/bluealsa.service /lib/systemd/system/bluealsa.service /etc/systemd/system/bluealsa.service 2>/dev/null | grep -E "^(ExecStart|User|Type)" || true
            cat /etc/systemd/system/bluealsa.service.d/*.conf 2>/dev/null || true
            # The offline installer: every package this setup installed, as a package source for the USB stick.
            echo "--- collecting packages for the offline installer"
            mkdir -p /w/pool && cd /w/pool
            dpkg-query -W -f="\${binary:Package}=\${Version}\n" | grep -v "^screenroom[:=]" > /tmp/pkgs
            xargs -a /tmp/pkgs -n 50 apt-get download -q >/dev/null 2>/tmp/dl.err || true
            for p in $(cat /tmp/pkgs); do n="${p%%=*}"; n="${n%%:*}"; ls ${n}_*.deb >/dev/null 2>&1 || apt-get download -q "$p" >/dev/null 2>>/tmp/dl.err || echo "MISSING $p"; done
            apt-get install -y -qq apt-utils >/dev/null
            apt-ftparchive packages . > Packages && apt-ftparchive release . > Release
            echo "pool: $(ls *.deb | wc -l) packages, $(du -sh . | cut -f1)"
          ' > container-setup.log 2>&1
          code=$?
          set -e
          tail -n 60 container-setup.log
          if [ "$code" != "0" ]; then
            grep -E "^E: |rror|Unable to|not found|no installation candidate|Depends:" container-setup.log | tail -n 25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            tail -n 8 container-setup.log | while IFS= read -r l; do echo "::error::tail: ${l//%/%25}"; done
            exit 1
          fi
          echo "::notice::Setup works on Debian 13"
          grep "^MISSING" container-setup.log | head -n 10 | while IFS= read -r l; do echo "::warning::offline installer: ${l}"; done
          echo "::notice::$(grep '^pool:' container-setup.log)"

      # ---- 2. the automatic installer image ----------------------------------------------------------
      - name: Tools
        timeout-minutes: 30
        run: |
          # (the runner's package installs sometimes hang: no manual-page rebuild, network timeouts, retries)
          sudo rm -f /var/lib/man-db/auto-update
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 300 apt-get $A update -y && sudo timeout 600 apt-get $A install -y --no-install-recommends xorriso qemu-system-x86 qemu-utils ovmf ffmpeg socat imagemagick && break
            echo "::warning::package install attempt $i failed, retrying"; sleep 10
          done
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "::warning::No KVM: the test install will be slow"; fi

      - uses: actions/cache@v4
        with:
          path: ~/.cache/screenroom-iso
          key: debian-netinst-${{ github.run_id }}
          restore-keys: debian-netinst-

      - name: Build the installer images
        run: |
          mkdir -p out
          DEB="$(ls dist/screenroom_*_amd64.deb)"
          sudo chown -R "$(id -u)" pool
          scripts/build-installer-iso.sh "$DEB" "out/Screenroom-Installer-${VERSION}.iso" --pool pool
          ssh-keygen -q -t ed25519 -N '' -f test_key
          scripts/build-installer-iso.sh "$DEB" installer-test.iso --pool pool --test-key test_key.pub
          # GitHub release files can't be over 2 GB.
          SIZE=$(stat -c %s "out/Screenroom-Installer-${VERSION}.iso"); echo "::notice::Installer size: $((SIZE / 1048576)) MB"
          [ "$SIZE" -lt 2000000000 ] || { echo "::error::The installer is over 2 GB, too big for a GitHub release"; exit 1; }
          cp "$DEB" out/
          cp dist/screenroom-linux-x64.tar.gz out/

      # ---- 3. install it in a virtual machine (UEFI, like the M910q) ---------------------------------
      - name: Prepare a virtual M910q (system drive + movie drive)
        run: |
          qemu-img create -f qcow2 os.qcow2 24G
          # A second drive that already has a show on it: it must be kept and used as the library.
          truncate -s 2G media.img
          mkfs.ext4 -q -F -L Movies media.img
          sudo mkdir -p /mnt/media && sudo mount -o loop media.img /mnt/media
          sudo mkdir -p "/mnt/media/Test Show/Season 1"
          ffmpeg -v error -f lavfi -i testsrc=size=1280x720:rate=24 -f lavfi -i sine=f=440 -t 20 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -metadata title="Hello" -metadata show="Test Show" \
            -metadata description="A test episode." /tmp/ep.mp4
          sudo cp /tmp/ep.mp4 "/mnt/media/Test Show/Season 1/S01E01 Hello.mp4"
          sudo umount /mnt/media
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd

      - name: Install (unattended)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KVM=""; [ -w /dev/kvm ] && KVM="-enable-kvm -cpu host"
          gh release view ci-screens >/dev/null 2>&1 || gh release create ci-screens --prerelease --latest=false \
            --title "CI screenshots (not for installing)" --notes "Screens from the latest automated test install."
          # A live picture of the virtual TV every 2 minutes, so a stuck install can be seen while it runs.
          ( while sleep 120; do
              echo "screendump install.ppm" | socat - UNIX-CONNECT:mon.sock >/dev/null 2>&1 || continue
              sleep 2; convert install.ppm screens-install-live.png 2>/dev/null && gh release upload ci-screens screens-install-live.png --clobber >/dev/null 2>&1 || true
            done ) &
          set +e
          # Installed with the network cable "unplugged": everything must come from the USB stick.
          timeout 100m qemu-system-x86_64 $KVM -m 4096 -smp 2 -machine q35 -S \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=os.qcow2,if=virtio,format=qcow2 \
            -drive file=media.img,if=virtio,format=raw \
            -drive file=installer-test.iso,media=cdrom,readonly=on \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -vga std -display none -monitor unix:mon.sock,server,nowait -no-reboot &
          QPID=$!
          for i in $(seq 1 50); do [ -S mon.sock ] && break; sleep 0.2; done
          printf 'set_link n0 off\ncont\n' | socat - UNIX-CONNECT:mon.sock >/dev/null
          wait $QPID
          code=$?
          set -e
          [ -f install.ppm ] && convert install.ppm screens-install-last.png || true
          if [ "$code" != "0" ]; then echo "::error::The unattended install did not finish (exit $code). See screens-install-last.png"; exit 1; fi
          echo "Install finished"

      - name: Boot the installed box and check it
        run: |
          KVM=""; [ -w /dev/kvm ] && KVM="-enable-kvm -cpu host"
          qemu-system-x86_64 $KVM -m 4096 -smp 2 -machine q35 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=os.qcow2,if=none,id=os,format=qcow2 -device virtio-blk-pci,drive=os,bootindex=1 \
            -drive file=media.img,if=none,id=media,format=raw -device virtio-blk-pci,drive=media \
            -drive file=installer-test.iso,if=none,id=cd,media=cdrom,readonly=on -device ide-cd,drive=cd,bootindex=0 \
            -netdev user,id=n0,hostfwd=tcp::2222-:22,hostfwd=tcp::8686-:8686 -device virtio-net-pci,netdev=n0 \
            -audiodev none,id=snd0 -device ich9-intel-hda -device hda-output,audiodev=snd0 \
            -vga std -display none -monitor unix:$PWD/mon2.sock,server,nowait -daemonize
          SSH="ssh -i test_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=5 -p 2222 screenroom@localhost"
          # The installer stick is still in (and first in the boot order): its menu must start the installed box,
          # not reinstall it.
          for i in $(seq 1 60); do $SSH true 2>/dev/null && break; sleep 5; done
          $SSH true || { echo "::error::The installed box never came up on ssh (did the installer start again?)"; echo "screendump $PWD/stuck.ppm" | socat - UNIX-CONNECT:$PWD/mon2.sock; sleep 2; convert stuck.ppm screens-stuck.png || true; exit 1; }
          sleep 75   # let the TV session start and the library scan run
          echo "screendump $PWD/boot.ppm" | socat - UNIX-CONNECT:$PWD/mon2.sock; sleep 2; convert boot.ppm screens-boot.png || true

          fail=0
          check() { if eval "$2" >/tmp/out 2>&1; then echo "::notice::OK  $1"; else echo "::error::FAIL $1: $(head -c 300 /tmp/out | tr '\n' ' ')"; fail=1; fi; }
          check "TV session running (lightdm)"          "$SSH systemctl is-active lightdm"
          check "Screenroom app running"                "$SSH pgrep -f /opt/Screenroom/screenroom"
          check "boot splash theme is Screenroom"       "$SSH grep -rqs screenroom /etc/alternatives/default.plymouth /etc/plymouth/plymouthd.conf"
          check "movie drive kept and mounted"           "$SSH findmnt -n -o SOURCE /srv/media | grep -q vdb"
          check "movie drive still has the show"        "$SSH test -f '\"/srv/media/Test Show/Season 1/S01E01 Hello.mp4\"'"
          check "Samba share running"                   "$SSH systemctl is-active smbd"
          check "phone remote page served"              "curl -fsS --max-time 10 http://localhost:8686/ | grep -q Screenroom"
          PIN="$($SSH sudo jq -r .remotePin /home/tv/.config/screenroom/config.json 2>/dev/null || true)"
          check "library shows the test show"           "curl -fsS --max-time 10 -H 'x-pin: $PIN' http://localhost:8686/api/library | grep -q 'Test Show'"
          check "maintenance login created"             "$SSH sudo test -s /etc/screenroom/maintenance"
          check "power button: press = menu, hold = off" "$SSH 'grep -q HandlePowerKey=ignore /etc/systemd/logind.conf.d/50-screenroom.conf && grep -q HandlePowerKeyLongPress=poweroff /etc/systemd/logind.conf.d/50-screenroom.conf && ! systemctl is-enabled suspend.target 2>/dev/null | grep -q masked'"
          check "TV user may put the box to sleep"     "$SSH \"sudo -u tv sh -c 'pkcheck --action-id org.freedesktop.login1.suspend --process \\\$\\\$'\""
          check "TV session never ends (no login screen)" "$SSH '! grep -q break /usr/local/bin/screenroom-session'"
          check "sound outputs switched on (none muted)" "$SSH 'amixer -c 0 scontents' > /tmp/mix; grep -q Playback /tmp/mix && ! grep -q '\[off\]' /tmp/mix"
          # (The test machine has no Bluetooth adapter, so this checks the service is set up and starts.)
          # Details for debugging go to screens-diag.txt on the ci-screens release (annotations are capped at 10).
          $SSH "set -x; dpkg -l | grep -i -E 'bluez|bluealsa'; ls -l /usr/bin/blue* /usr/sbin/blue* 2>&1; systemctl cat bluealsa.service; systemctl status bluealsa --no-pager -n 20; sudo grep -n -i -E -A25 'sound and Bluetooth|box refresh' /var/log/screenroom-install.log | head -80" > screens-diag.txt 2>&1 || true
          # The Settings → System → "Check for updates" button: the TV user (the app) may start the update service.
          { echo "=== polkit"; $SSH "dpkg -l | grep -i polkit; sudo ls -la /etc/polkit-1/rules.d /usr/share/polkit-1/rules.d; sudo cat /etc/polkit-1/rules.d/50-screenroom.rules; systemctl status polkit --no-pager -n 5; sudo -u tv systemctl start --no-block screenroom-update.service; echo exit=\$?; sudo journalctl -u polkit --no-pager -n 20"; } >> screens-diag.txt 2>&1 || true
          check "optional extras installed"            "$SSH dpkg -s polkitd cec-utils python3-evdev udiskie gvfs >/dev/null"
          check "TV user may restart / shut down"      "$SSH \"sudo -u tv sh -c 'pkcheck --action-id org.freedesktop.login1.reboot --process \\\$\\\$'\""
          check "TV user may start an update"          "$SSH 'sudo -u tv systemctl start --no-block screenroom-update.service'"
          check "Bluetooth sound service set up"       "$SSH 'systemctl is-enabled bluealsa && sudo systemctl start bluealsa && sleep 3 && systemctl is-active bluealsa'"
          # An update (installing a newer app package) also brings the box's own setup up to date.
          scp -i test_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 out/screenroom_*_amd64.deb screenroom@localhost:/tmp/sr.deb || echo "::error::copying the app package to the test box failed"
          $SSH "sudo apt-get install -y --reinstall /tmp/sr.deb >/dev/null 2>&1" || echo "::error::reinstalling the app package failed"
          sleep 45
          { echo "=== refresh after update"; $SSH "sudo tail -n 40 /var/log/screenroom-refresh.log"; } >> screens-diag.txt 2>&1 || true
          check "update refreshes the box setup"       "$SSH grep -q 'box refresh done' /var/log/screenroom-refresh.log"
          echo "---- disks log";   $SSH sudo cat /var/log/screenroom-disks.log || true
          echo "---- install log (tail)"; $SSH sudo tail -n 40 /var/log/screenroom-install.log || true
          echo "screendump $PWD/final.ppm" | socat - UNIX-CONNECT:$PWD/mon2.sock; sleep 2; convert final.ppm screens-final.png || true
          echo "$fail" > test-result
          [ "$fail" = "0" ]

      - name: Share screenshots from the test (for debugging)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-screens
          name: CI screenshots (not for installing)
          prerelease: true
          make_latest: false
          body: Screens from the latest automated test install. Not an installable release.
          files: |
            screens-*.png
            screens-diag.txt
          fail_on_unmatched_files: false

      # ---- 4. publish --------------------------------------------------------------------------------------
      - name: Publish the installer and app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ github.run_number }}
          name: Screenroom for Linux / M910q (build ${{ github.run_number }})
          body: |
            **Screenroom-Installer-${{ env.VERSION }}.iso**: automatic installer for a mini PC (ThinkCentre M910q etc.). Write it to a USB stick, boot from it with a network cable plugged in. It erases the main drive. See deploy/M910Q.md.
            **screenroom_${{ env.VERSION }}_amd64.deb**: the app on its own (for updates / manual installs).
            **screenroom-linux-x64.tar.gz**: the app folder for Heirloom (run as `screenroom --edition=films` for Screenroom, `--edition=music` for Parlor).
            Tested automatically: unattended install in a virtual machine, then boot, app, movie drive and phone remote checks.
          files: out/*
          make_latest: false
