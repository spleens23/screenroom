name: iPad app

on:
  push:
    branches: [main]
    paths: ["ios/**", "renderer/**", "lib/media-core.js", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  # Builds the app and tries it in a simulated iPad with a few test films and songs. Screenshots go to the
  # "ios-ci-screens" release (not an app to install).
  check:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen ffmpeg
      - name: mpv's engine (cached)
        uses: actions/cache@v4
        with:
          path: ios/vendor/mpvkit
          key: mpvkit-${{ hashFiles('ios/scripts/fetch-mpvkit.sh') }}
      - name: Generate the Xcode project
        run: |
          mkdir -p shots
          set -o pipefail
          { ios/scripts/fetch-mpvkit.sh && ios/scripts/prepare-web.sh && cd ios && xcodegen generate; } 2>&1 | tee shots/generate.txt
      - name: Build for the simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Screenroom.xcodeproj -scheme Screenroom -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" -B2 -A3 build.log | head -150 | tee ../shots/build-errors.txt; tail -40 build.log >> ../shots/build-errors.txt; exit 1; }
      - name: Build the release version for the simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Screenroom.xcodeproj -scheme Screenroom -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-rel CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-rel.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
      - name: Try it in a simulated iPad
        run: |
          mkdir -p shots
          exec > >(tee shots/simulator.txt) 2>&1
          set -x
          # an iPad simulator that came with this Xcode (newest iOS, preferring an 11-inch iPad Pro)
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [(rt, x) for rt, l in d.items() if 'iOS' in rt for x in l if 'iPad' in x['name']]
          c.sort(key=lambda t: (t[0], 'Pro 11' in t[1]['name']))
          print(c[-1][1]['udid'])")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "$UDID" > udid.txt
          # first, the release version on a fresh iPad with nothing on it yet (what someone installing it sees)
          REL="$(find ios/build-rel/Build/Products -name Screenroom.app -maxdepth 3 | head -1)"
          if [ -n "$REL" ]; then
            xcrun simctl install "$UDID" "$REL"
            xcrun simctl launch "$UDID" dev.screenroom.ipad; sleep 25; xcrun simctl io "$UDID" screenshot shots/first-run-release.png
            RDATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
            cat "$RDATA/Library/Caches/page-errors.log" > shots/page-errors-release.txt 2>/dev/null || echo "(no page errors)" > shots/page-errors-release.txt
            cat shots/page-errors-release.txt
            xcrun simctl terminate "$UDID" dev.screenroom.ipad || true
            xcrun simctl uninstall "$UDID" dev.screenroom.ipad || true
          else
            echo "(release build missing)" > shots/page-errors-release.txt; tail -40 ios/build-rel.log >> shots/page-errors-release.txt
          fi
          APP="$(find ios/build/Build/Products -name Screenroom.app -maxdepth 3 | head -1)"
          xcrun simctl install "$UDID" "$APP"
          DATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
          ios/scripts/make-test-media.sh "$DATA/Documents"
          xcrun simctl status_bar "$UDID" override --time "9:41" || true
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          run() { xcrun simctl terminate "$UDID" dev.screenroom.ipad 2>/dev/null || true; xcrun simctl launch "$UDID" dev.screenroom.ipad --ui-script "$1"; }
          xcrun simctl launch "$UDID" dev.screenroom.ipad; shot home 25
          run "document.querySelector('#parlor-btn').click()"; shot parlor 16
          run "document.querySelector('#parlor-btn').click(); setTimeout(() => document.querySelector('.card.pcard').click(), 800)"; shot album 18
          run "document.querySelector('#parlor-btn').click(); setTimeout(async () => { const p = await api.parlorState(); await api.musicPlay({ trackIds: p.albums[0].tracks }); }, 1500)"; shot music 18
          run "document.querySelector('#settings-btn').click()"; shot settings 14
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Neon/i.test(x.textContent)); c && c.click()"; shot show 15
          run "api.state().then(s => api.play({ id: s.library.find(i => /Last Signal/.test(i.title)).id }))"; shot player 18
          run "api.state().then(s => { const f = s.library.find(i => /Desert Signal/.test(i.title || i.path)); f ? api.play({ id: f.id }) : console.error('no DTS film in the library'); })"; shot player-vlc 11
          run "api.state().then(s => { const f = s.library.find(i => /Harbor Lights/.test(i.title || i.path)); f ? api.play({ id: f.id }) : console.error('no DTS mp4 in the library'); })"; shot player-vlc-mp4 11
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Harbor Lights/i.test(x.title)); c && c.click()"; shot film-dts-mp4 12
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Paper Lanterns/i.test(x.textContent + x.title)); c ? c.click() : console.error('no Paper Lanterns card')"; shot film-tagged 12
          run "(async () => { const r = await api.saveProfile({ name: 'Second', color: '#3a6ea5' }); const id = (r.profile || r.state.profiles.find(p => p.name === 'Second')).id; await api.selectProfile(id); const p = await api.parlorState(); console.error('second profile sees ' + p.albums.length + ' albums'); document.querySelector('#parlor-btn').click(); })()"; shot parlor-second-profile 16
          run "api.selectProfile('main')"; sleep 10
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); [print(v.get('engine','apple'), v.get('art','-')[-30:], v['path'].split('/')[-1], [x.get('codec_name') for x in v['probe']['streams']], json.dumps(v['probe']['format'].get('tags',{}))[:200]) for v in d.values()]" "$DATA/Library/Application Support/Screenroom/scan-films-5.json" > shots/engines.txt 2>&1 || true
          xcrun simctl io "$UDID" screenshot shots/player2.png || true
          if [ -s "$DATA/Library/Caches/page-errors.log" ]; then cp "$DATA/Library/Caches/page-errors.log" shots/page-errors.txt; else echo "(no page errors)" > shots/page-errors.txt; fi
          cat shots/page-errors.txt
          ls "$DATA/Library/Application Support/Screenroom" | tee shots/data-files.txt
      - name: Tap through the player
        run: |
          UDID="$(cat udid.txt)"
          mkdir -p shots
          cd ios
          set -o pipefail
          TEST_RUNNER_SHOTS="$PWD/../shots" xcodebuild test -project Screenroom.xcodeproj -scheme Screenroom -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 \
            | tee uitest.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" || true
          { grep -E "Test Case .*(passed|failed)|: error:|TEST (SUCCEEDED|FAILED)" uitest.log; echo ---; tail -25 uitest.log; } > ../shots/uitest.txt
          DATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
          cat "$DATA/Library/Caches/mpv.log" > ../shots/mpv-log.txt 2>/dev/null || echo "(no mpv log)" > ../shots/mpv-log.txt
          cat "$DATA/Library/Caches/ui.log" > ../shots/ui-log.txt 2>/dev/null || echo "(no ui log)" > ../shots/ui-log.txt
          tail -60 ../shots/mpv-log.txt
      - name: Try it on a simulated iPhone
        continue-on-error: true
        run: |
          mkdir -p shots
          exec > >(tee shots/iphone.txt) 2>&1
          set -x
          # the newest iPhone simulator that came with this Xcode (preferring a Pro, the size most people have)
          P="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [(rt, x) for rt, l in d.items() if 'iOS' in rt for x in l if x['name'].startswith('iPhone')]
          c.sort(key=lambda t: (t[0], ' Pro' in t[1]['name'] and 'Max' not in t[1]['name']))
          print(c[-1][1]['udid'])")"
          xcrun simctl boot "$P"; xcrun simctl bootstatus "$P" -b
          APP="$(find ios/build/Build/Products -name Screenroom.app -maxdepth 3 | head -1)"
          xcrun simctl install "$P" "$APP"
          PDATA="$(xcrun simctl get_app_container "$P" dev.screenroom.ipad data)"
          ios/scripts/make-test-media.sh "$PDATA/Documents"
          xcrun simctl status_bar "$P" override --time "9:41" || true
          shot() { sleep "$2"; xcrun simctl io "$P" screenshot "shots/iphone-$1.png"; }
          run() { xcrun simctl terminate "$P" dev.screenroom.ipad 2>/dev/null || true; xcrun simctl launch "$P" dev.screenroom.ipad --ui-script "$1"; }
          xcrun simctl launch "$P" dev.screenroom.ipad; shot home 30
          run "window.scrollTo(0, 600)"; shot rows 14
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Paper Lanterns/i.test(x.textContent + x.title)) || document.querySelector('.card'); c.click()"; shot film 14
          run "document.querySelector('#settings-btn').click()"; shot settings 14
          run "document.querySelector('#parlor-btn').click()"; shot parlor 14
          run "api.state().then(s => { const f = s.library.find(i => /Night Ferry/.test(i.title || i.path)); f && api.play({ id: f.id }); })"; shot player 16
          run "api.state().then(s => { const f = s.library.find(i => /Last Signal/.test(i.title || i.path)); f && api.play({ id: f.id }); })"; shot player-apple 16
          if [ -s "$PDATA/Library/Caches/page-errors.log" ]; then cp "$PDATA/Library/Caches/page-errors.log" shots/iphone-page-errors.txt; else echo "(no page errors)" > shots/iphone-page-errors.txt; fi
          cat shots/iphone-page-errors.txt
      - name: Try Parlor (the music app) in the simulated iPad
        continue-on-error: true
        run: |
          mkdir -p shots
          exec > >(tee shots/parlor.txt) 2>&1
          set -x
          UDID="$(cat udid.txt)"
          cd ios
          xcodebuild -project Screenroom.xcodeproj -scheme Parlor -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-parlor.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-parlor.log || { grep -E "error:" -B2 -A3 build-parlor.log | head -80 > ../shots/parlor-build-errors.txt; exit 1; }
          cd ..
          APP="$(find ios/build/Build/Products -name Parlor.app -maxdepth 3 | head -1)"
          xcrun simctl install "$UDID" "$APP"
          PD="$(xcrun simctl get_app_container "$UDID" dev.screenroom.parlor data)"
          ios/scripts/make-test-media.sh "$PD/Documents"
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/parlor-$1.png"; }
          run() { xcrun simctl terminate "$UDID" dev.screenroom.parlor 2>/dev/null || true; xcrun simctl launch "$UDID" dev.screenroom.parlor --ui-script "$1"; }
          xcrun simctl launch "$UDID" dev.screenroom.parlor; shot home 30
          # a moving cover added after the library was scanned (Parlor should notice next time it opens)
          cp "$PD/Documents/Music/Slow Band/Long Album/cover.mp4" "$PD/Documents/Music/Late Band/Late Album/cover.mp4"
          # the album with a moving cover: is the loop playing?
          run "const c=[...document.querySelectorAll('.card.pcard')].find(x=>/Long Album/.test(x.title)); c && c.click(); setTimeout(() => { const v = document.querySelector('#modal video.motion'); console.error('moving cover: ' + (v ? JSON.stringify({ playing: v.classList.contains('on'), t: v.currentTime, err: v.error && v.error.code }) : 'none')); }, 6000)"; shot album 16
          # an H.265 cover labelled "hev1", 10-bit and bigger than 4 MB, like ones made by many apps
          run "const c=[...document.querySelectorAll('.card.pcard')].find(x=>/Low Tide/.test(x.title)); c && c.click(); setTimeout(() => { const v = document.querySelector('#modal video.motion'); console.error('hevc cover: ' + (v ? JSON.stringify({ playing: v.classList.contains('on'), t: v.currentTime, err: v.error && v.error.code }) : 'none')); api.parlorMotionReport().then(r => console.error('motion report: ' + JSON.stringify(r))); }, 8000)"; shot album-hevc 18
          run "api.parlorState().then(p => { const a = p.albums.find(x => /Long Album/.test(x.title)); return api.musicPlay({ trackIds: a.tracks, start: 0 }); }).then(() => setTimeout(() => { const b = document.querySelector('.npb-art'); b && b.click(); }, 2500))"; shot nowplaying 18
          # (if the app stopped responding, show where its main thread is waiting)
          P=$(pgrep -n -x Parlor || true); if [ -n "$P" ]; then sample "$P" 1 -file /tmp/parlor-sample.txt >/dev/null 2>&1 && grep -m1 -A30 "com.apple.main-thread" /tmp/parlor-sample.txt | cut -c1-160 || true; fi
          run "setTimeout(() => { const c=[...document.querySelectorAll('.card.pcard')].find(x=>/Late Album/.test(x.title)); c && c.click(); setTimeout(() => { const v = document.querySelector('#modal video.motion'); console.error('late cover: ' + (v ? JSON.stringify({ playing: v.classList.contains('on'), t: v.currentTime }) : 'none')); }, 6000); }, 9000)"; shot late-cover 22
          # surround songs: channels read, and the 7.1 FLAC actually playing
          run "api.parlorState().then(p => { const a = p.albums.find(x => /Six Room/.test(x.title)); console.error('surround: ' + JSON.stringify(a ? a.tracks.map(id => [p.tracks[id].title, p.tracks[id].channels, p.tracks[id].codec]) : 'no album')); return a && api.musicPlay({ trackIds: a.tracks, start: 1 }); }).then(() => setTimeout(() => api.parlorState().then(p => console.error('surround playing: ' + JSON.stringify({ pos: p.player && p.player.pos, track: p.player && p.player.track && p.player.track.title, route: p.player && p.player.route }))), 5000))"; shot surround 12
          if [ -s "$PD/Library/Caches/page-errors.log" ]; then cp "$PD/Library/Caches/page-errors.log" shots/parlor-page-errors.txt; else echo "(no page errors)" > shots/parlor-page-errors.txt; fi
          cat shots/parlor-page-errors.txt
      - name: Share the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-ci-screens >/dev/null 2>&1 || gh release create ios-ci-screens --prerelease --latest=false \
            --title "iPad app: test screenshots (not for installing)" --notes "From the latest automated check in a simulated iPad."
          [ -f shots-vlc.txt ] && cp shots-vlc.txt shots/vlckit.txt
          for f in shots/*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || echo "couldn't upload $f"; done

  # Signs the app and sends it to TestFlight (needs the App Store Connect key in this repository's secrets).
  testflight:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Is the App Store Connect key set up?
        id: key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice title=TestFlight::Not sent to TestFlight: add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID to the repository's secrets."; echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Build, sign and upload
        if: steps.key.outputs.ready == 'yes'
        run: |
          set -o pipefail
          brew install xcodegen
          ios/scripts/fetch-mpvkit.sh
          ios/scripts/prepare-web.sh
          cd ios && xcodegen generate
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | (base64 --decode 2>/dev/null || cat) > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || printf '%s' "$ASC_KEY_P8" > "$KEY"
          export KEY BUILD="$GITHUB_RUN_NUMBER"
          # Screenroom (films) must go through; Parlor (music) needs its own app in App Store Connect first, so it
          # doesn't stop Screenroom's upload when it can't go yet (its notes say why)
          scripts/ship.sh Screenroom
          scripts/ship.sh Parlor || echo "::warning title=Parlor::Parlor wasn't uploaded: see testflight-parlor-errors.txt. It needs an app for dev.screenroom.parlor in App Store Connect."
      - name: What App Store Connect says
        if: always() && steps.key.outputs.ready == 'yes'
        run: |
          mkdir -p shots
          cp shots/testflight-screenroom-export.log shots/testflight-export.log 2>/dev/null || true
          KEY="$RUNNER_TEMP/AuthKey-status.p8"
          printf '%s' "$ASC_KEY_P8" | (base64 --decode 2>/dev/null || cat) > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || printf '%s' "$ASC_KEY_P8" > "$KEY"
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          sleep 90
          ASC_KEY_FILE="$KEY" python3 ios/scripts/asc-status.py > shots/testflight-status.txt 2>&1 || true
          cat shots/testflight-status.txt
          ASC_BUNDLE=dev.screenroom.parlor ASC_KEY_FILE="$KEY" python3 ios/scripts/asc-status.py > shots/testflight-parlor-status.txt 2>&1 || true
          cat shots/testflight-parlor-status.txt
      - name: Keep the upload notes
        if: always() && steps.key.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'for f in shots/testflight-*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || true; done'
      - name: Share what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'for f in shots/*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || true; done'
