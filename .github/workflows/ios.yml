name: iPad app

on:
  push:
    branches: [main]
    paths: ["ios/**", "renderer/**", "lib/media-core.js", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  # Builds the app and tries it in a simulated iPad with a few test films and songs. Screenshots go to the
  # "ios-ci-screens" release (not an app to install).
  check:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen ffmpeg
      - name: mpv's engine (Swift packages, cached)
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ hashFiles('ios/project.yml') }}
      - name: Generate the Xcode project
        run: |
          mkdir -p shots
          set -o pipefail
          { ios/scripts/prepare-web.sh && cd ios && xcodegen generate; } 2>&1 | tee shots/generate.txt
      - name: Build for the simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Screenroom.xcodeproj -scheme Screenroom -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -clonedSourcePackagesDirPath .spm CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" -B2 -A3 build.log | head -150 | tee ../shots/build-errors.txt; tail -40 build.log >> ../shots/build-errors.txt; exit 1; }
      - name: Build the release version for the simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Screenroom.xcodeproj -scheme Screenroom -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-rel -clonedSourcePackagesDirPath .spm CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-rel.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
      - name: Try it in a simulated iPad
        run: |
          mkdir -p shots
          exec > >(tee shots/simulator.txt) 2>&1
          set -x
          # an iPad simulator that came with this Xcode (newest iOS, preferring an 11-inch iPad Pro)
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [(rt, x) for rt, l in d.items() if 'iOS' in rt for x in l if 'iPad' in x['name']]
          c.sort(key=lambda t: (t[0], 'Pro 11' in t[1]['name']))
          print(c[-1][1]['udid'])")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "$UDID" > udid.txt
          # first, the release version on a fresh iPad with nothing on it yet (what someone installing it sees)
          REL="$(find ios/build-rel/Build/Products -name Screenroom.app -maxdepth 3 | head -1)"
          if [ -n "$REL" ]; then
            xcrun simctl install "$UDID" "$REL"
            xcrun simctl launch "$UDID" dev.screenroom.ipad; sleep 25; xcrun simctl io "$UDID" screenshot shots/first-run-release.png
            RDATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
            cat "$RDATA/Library/Caches/page-errors.log" > shots/page-errors-release.txt 2>/dev/null || echo "(no page errors)" > shots/page-errors-release.txt
            cat shots/page-errors-release.txt
            xcrun simctl terminate "$UDID" dev.screenroom.ipad || true
            xcrun simctl uninstall "$UDID" dev.screenroom.ipad || true
          else
            echo "(release build missing)" > shots/page-errors-release.txt; tail -40 ios/build-rel.log >> shots/page-errors-release.txt
          fi
          APP="$(find ios/build/Build/Products -name Screenroom.app -maxdepth 3 | head -1)"
          xcrun simctl install "$UDID" "$APP"
          DATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
          ios/scripts/make-test-media.sh "$DATA/Documents"
          xcrun simctl status_bar "$UDID" override --time "9:41" || true
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          run() { xcrun simctl terminate "$UDID" dev.screenroom.ipad 2>/dev/null || true; xcrun simctl launch "$UDID" dev.screenroom.ipad --ui-script "$1"; }
          xcrun simctl launch "$UDID" dev.screenroom.ipad; shot home 25
          run "document.querySelector('#parlor-btn').click()"; shot parlor 16
          run "document.querySelector('#parlor-btn').click(); setTimeout(() => document.querySelector('.card.pcard').click(), 800)"; shot album 18
          run "document.querySelector('#parlor-btn').click(); setTimeout(async () => { const p = await api.parlorState(); await api.musicPlay({ trackIds: p.albums[0].tracks }); }, 1500)"; shot music 18
          run "document.querySelector('#settings-btn').click()"; shot settings 14
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Neon/i.test(x.textContent)); c && c.click()"; shot show 15
          run "api.state().then(s => api.play({ id: s.library.find(i => /Last Signal/.test(i.title)).id }))"; shot player 18
          run "api.state().then(s => { const f = s.library.find(i => /Desert Signal/.test(i.title || i.path)); f ? api.play({ id: f.id }) : console.error('no DTS film in the library'); })"; shot player-vlc 11
          run "api.state().then(s => { const f = s.library.find(i => /Harbor Lights/.test(i.title || i.path)); f ? api.play({ id: f.id }) : console.error('no DTS mp4 in the library'); })"; shot player-vlc-mp4 11
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Harbor Lights/i.test(x.title)); c && c.click()"; shot film-dts-mp4 12
          run "const c=[...document.querySelectorAll('.card')].find(x=>/Paper Lanterns/i.test(x.textContent + x.title)); c ? c.click() : console.error('no Paper Lanterns card')"; shot film-tagged 12
          run "(async () => { const r = await api.saveProfile({ name: 'Second', color: '#3a6ea5' }); const id = (r.profile || r.state.profiles.find(p => p.name === 'Second')).id; await api.selectProfile(id); const p = await api.parlorState(); console.error('second profile sees ' + p.albums.length + ' albums'); document.querySelector('#parlor-btn').click(); })()"; shot parlor-second-profile 16
          run "api.selectProfile('main')"; sleep 10
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); [print(v.get('engine','apple'), v.get('art','-')[-30:], v['path'].split('/')[-1], [x.get('codec_name') for x in v['probe']['streams']], json.dumps(v['probe']['format'].get('tags',{}))[:200]) for v in d.values()]" "$DATA/Library/Application Support/Screenroom/scan-films-5.json" > shots/engines.txt 2>&1 || true
          xcrun simctl io "$UDID" screenshot shots/player2.png || true
          if [ -s "$DATA/Library/Caches/page-errors.log" ]; then cp "$DATA/Library/Caches/page-errors.log" shots/page-errors.txt; else echo "(no page errors)" > shots/page-errors.txt; fi
          cat shots/page-errors.txt
          ls "$DATA/Library/Application Support/Screenroom" | tee shots/data-files.txt
      - name: Tap through the player
        run: |
          UDID="$(cat udid.txt)"
          mkdir -p shots
          cd ios
          set -o pipefail
          TEST_RUNNER_SHOTS="$PWD/../shots" xcodebuild test -project Screenroom.xcodeproj -scheme Screenroom -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build -clonedSourcePackagesDirPath .spm CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 \
            | tee uitest.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" || true
          { grep -E "Test Case .*(passed|failed)|: error:|TEST (SUCCEEDED|FAILED)" uitest.log; echo ---; tail -25 uitest.log; } > ../shots/uitest.txt
          DATA="$(xcrun simctl get_app_container "$UDID" dev.screenroom.ipad data)"
          cat "$DATA/Library/Caches/mpv.log" > ../shots/mpv-log.txt 2>/dev/null || echo "(no mpv log)" > ../shots/mpv-log.txt
          tail -60 ../shots/mpv-log.txt
      - name: Share the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-ci-screens >/dev/null 2>&1 || gh release create ios-ci-screens --prerelease --latest=false \
            --title "iPad app: test screenshots (not for installing)" --notes "From the latest automated check in a simulated iPad."
          [ -f shots-vlc.txt ] && cp shots-vlc.txt shots/vlckit.txt
          for f in shots/*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || echo "couldn't upload $f"; done

  # Signs the app and sends it to TestFlight (needs the App Store Connect key in this repository's secrets).
  testflight:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Is the App Store Connect key set up?
        id: key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice title=TestFlight::Not sent to TestFlight: add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID to the repository's secrets."; echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Build, sign and upload
        if: steps.key.outputs.ready == 'yes'
        run: |
          set -o pipefail
          brew install xcodegen
          ios/scripts/prepare-web.sh
          cd ios && xcodegen generate
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | (base64 --decode 2>/dev/null || cat) > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # The archive is built unsigned: signing it for development would need a registered iPad. The export below
          # signs it for the App Store with Apple's cloud-managed distribution certificate (needs an Admin key).
          xcodebuild -project Screenroom.xcodeproj -scheme Screenroom -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Screenroom.xcarchive -clonedSourcePackagesDirPath .spm DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          mkdir -p ../shots
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -E "error:" -B2 -A3 archive.log | head -100 | tee ../shots/testflight-errors.txt; tail -30 archive.log >> ../shots/testflight-errors.txt; exit 1; }
          # mpv's libraries are static (already linked into the app); Xcode still copies their empty framework folders
          # into the app, which App Store Connect rejects as unsigned code. Take them out before signing.
          APPDIR=build/Screenroom.xcarchive/Products/Applications/Screenroom.app
          for f in "$APPDIR"/Frameworks/*.framework; do
            [ -d "$f" ] || continue
            b="$f/$(basename "$f" .framework)"
            if [ ! -f "$b" ] || file "$b" | grep -q "ar archive"; then echo "static, not shipped: $(basename "$f")"; rm -rf "$f"; fi
          done
          ls "$APPDIR/Frameworks" || true
          sed "s/TEAM_ID_HERE/$TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Screenroom.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" > export.log 2>&1 || true
          tail -20 export.log
          { grep -q "EXPORT SUCCEEDED" export.log && ! grep -qiE "EXPORT FAILED|Upload failed|Validation failed" export.log; } || { mkdir -p ../shots; { grep -iE "error|fail" export.log | head -40; echo ----; tail -80 export.log; } > ../shots/testflight-errors.txt; exit 1; }
          echo "::notice title=TestFlight::Build $GITHUB_RUN_NUMBER sent to App Store Connect. It shows up in TestFlight once Apple has processed it (usually 10–30 minutes)."
      - name: What App Store Connect says
        if: always() && steps.key.outputs.ready == 'yes'
        run: |
          mkdir -p shots
          cp ios/export.log shots/testflight-export.log 2>/dev/null || true
          KEY="$RUNNER_TEMP/AuthKey-status.p8"
          printf '%s' "$ASC_KEY_P8" | (base64 --decode 2>/dev/null || cat) > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || printf '%s' "$ASC_KEY_P8" > "$KEY"
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          sleep 90
          ASC_KEY_FILE="$KEY" python3 ios/scripts/asc-status.py > shots/testflight-status.txt 2>&1 || true
          cat shots/testflight-status.txt
      - name: Keep the upload notes
        if: always() && steps.key.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'for f in shots/testflight-*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || true; done'
      - name: Share what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'for f in shots/*; do [ -s "$f" ] && gh release upload ios-ci-screens "$f" --clobber || true; done'
