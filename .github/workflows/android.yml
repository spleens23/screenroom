name: Android TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Screenroom-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Screenroom-android-${{ github.run_number }}
          path: out/*.apk

      - name: Publish a release you can download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Screenroom for Android TV (build ${{ github.run_number }})
          body: |
            Install on your onn 4K Pro (or any Android TV / Google TV box) — see android/SETUP.md.
          files: out/*.apk
          make_latest: true
